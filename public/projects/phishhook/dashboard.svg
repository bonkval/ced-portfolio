    <rect x="328" y="130" width="250" height="116" rx="14" fill="#1b1725" stroke="#2c243b"/><text x="348" y="158" fill="#9b91ad" font-size="13">SMTP ACCEPTED</text><text x="348" y="202" fill="#fff" font-size="38" font-weight="700">23</text><text x="425" y="201" fill="#a991e2" font-size="13">95.8%</text>
    <rect x="594" y="130" width="250" height="116" rx="14" fill="#1b1725" stroke="#2c243b"/><text x="614" y="158" fill="#9b91ad" font-size="13">CONFIRMED</text><text x="614" y="202" fill="#fff" font-size="38" font-weight="700">7</text><text x="674" y="201" fill="#a991e2" font-size="13">29.2%</text>
    <rect x="860" y="130" width="240" height="116" rx="14" fill="#1b1725" stroke="#2c243b"/><text x="880" y="158" fill="#9b91ad" font-size="13">SEND FAILURES</text><text x="880" y="202" fill="#fff" font-size="38" font-weight="700">1</text><text x="940" y="201" fill="#f0a5b5" font-size="13">review</text>
    <rect x="62" y="270" width="520" height="380" rx="14" fill="#1b1725" stroke="#2c243b"/><text x="86" y="306" fill="#fff" font-size="18" font-weight="700">Engagement funnel</text><text x="86" y="329" fill="#9b91ad" font-size="13">Each stage is proportional to the previous one</text>
    <path d="M110 372 L534 372 L486 430 L158 430 Z" fill="#d2c3f6"/><text x="322" y="407" text-anchor="middle" fill="#181320" font-size="16" font-weight="700">SMTP accepted · 23</text>
