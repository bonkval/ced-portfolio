<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PhishHook live dashboard</title>
  <desc id="desc">A synthetic PhishHook dashboard showing campaign delivery and engagement signals.</desc>
  <rect width="1200" height="720" fill="#0b0a0f"/>
  <rect x="28" y="24" width="1144" height="672" rx="22" fill="#12101a" stroke="#36255c" stroke-width="2"/>
