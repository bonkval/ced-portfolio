    <rect x="610" y="474" width="490" height="176" rx="14" fill="#1b1725" stroke="#2c243b"/><text x="634" y="510" fill="#fff" font-size="18" font-weight="700">Recent signals</text><circle cx="642" cy="544" r="5" fill="#d2c3f6"/><text x="658" y="549" fill="#fff" font-size="14">Confirmed engagement · 2 min ago</text><circle cx="642" cy="578" r="5" fill="#8f78cf"/><text x="658" y="583" fill="#fff" font-size="14">Link visited · 7 min ago</text><circle cx="642" cy="612" r="5" fill="#706a7d"/><text x="658" y="617" fill="#fff" font-size="14">SMTP accepted · 11 min ago</text>
