  <rect x="856" y="48" width="122" height="38" rx="19" fill="#36255c"/><text x="917" y="73" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14">Dashboard</text>
  <rect x="988" y="48" width="112" height="38" rx="19" fill="#241a3d"/><text x="1044" y="73" text-anchor="middle" fill="#d2c3f6" font-family="Arial,sans-serif" font-size="14">Campaigns</text>
  <g font-family="Arial,sans-serif">
