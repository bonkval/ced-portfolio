<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PhishHook campaign review</title><desc id="desc">A synthetic final review screen with recipient and email safety checks.</desc>
  <rect width="1200" height="720" fill="#0b0a0f"/><rect x="28" y="24" width="1144" height="672" rx="22" fill="#12101a" stroke="#36255c" stroke-width="2"/>
  <text x="62" y="76" fill="#d2c3f6" font-family="Arial,sans-serif" font-size="28" font-weight="700">Campaign review</text><text x="62" y="104" fill="#9b91ad" font-family="Arial,sans-serif" font-size="14">Final checkpoint before an authorized awareness send</text>
  <rect x="62" y="142" width="1076" height="96" rx="14" fill="#1b1725" stroke="#2c243b"/><text x="88" y="176" fill="#9b91ad" font-family="Arial,sans-serif" font-size="13">CAMPAIGN NAME</text><text x="88" y="211" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Quarterly security refresher</text><rect x="890" y="173" width="212" height="38" rx="19" fill="#36255c"/><text x="996" y="197" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14">Ready for approval</text>
  <g font-family="Arial,sans-serif"><rect x="62" y="268" width="520" height="354" rx="14" fill="#1b1725" stroke="#2c243b"/><text x="88" y="306" fill="#fff" font-size="18" font-weight="700">Safety checklist</text><g font-size="15"><circle cx="96" cy="350" r="10" fill="#8f78cf"/><text x="120" y="356" fill="#fff">Recipients are explicitly authorized</text><circle cx="96" cy="398" r="10" fill="#8f78cf"/><text x="120" y="404" fill="#fff">No credential collection or forms</text><circle cx="96" cy="446" r="10" fill="#8f78cf"/><text x="120" y="452" fill="#fff">25-recipient safety cap respected</text><circle cx="96" cy="494" r="10" fill="#8f78cf"/><text x="120" y="500" fill="#fff">Education link points to OCC guidance</text><circle cx="96" cy="542" r="10" fill="#8f78cf"/><text x="120" y="548" fill="#fff">Tracking URL uses the deployed Worker</text></g></g>
  <rect x="610" y="268" width="528" height="354" rx="14" fill="#1b1725" stroke="#2c243b"/><text x="636" y="306" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Send summary</text><text x="636" y="350" fill="#9b91ad" font-family="Arial,sans-serif" font-size="13">AUTHORIZED RECIPIENTS</text><text x="636" y="382" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">12</text><text x="636" y="428" fill="#9b91ad" font-family="Arial,sans-serif" font-size="13">SMTP profile</text><text x="636" y="456" fill="#fff" font-family="Arial,sans-serif" font-size="16">smtp.example.test · TLS</text><line x1="636" y1="484" x2="1110" y2="484" stroke="#36255c"/><text x="636" y="522" fill="#9b91ad" font-family="Arial,sans-serif" font-size="13">ESTIMATED DELIVERY</text><text x="636" y="554" fill="#d2c3f6" font-family="Arial,sans-serif" font-size="24" font-weight="700">Immediately after approval</text><rect x="884" y="574" width="226" height="34" rx="17" fill="#d2c3f6"/><text x="997" y="596" text-anchor="middle" fill="#181320" font-family="Arial,sans-serif" font-size="14" font-weight="700">Review and send</text>
</svg>
