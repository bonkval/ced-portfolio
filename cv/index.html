<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Cedrick Rafael Vales CV status and upcoming download.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://crdv.vercel.app/cv/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>CV — Cedrick Rafael Vales</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/custom-overrides.css">
</head>
<body>
  <div class="theme-wave" aria-hidden="true"></div>
  <header class="site-header">
    <a class="identity" href="/" aria-label="CRDV home"><span class="identity-name">CRDV</span></a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span class="sr-only">Menu</span></button>
    <nav class="site-nav" id="site-nav" aria-label="Primary"><a href="/#work">Work</a><a href="/#certifications">Credentials</a><a href="/#contact">Contact</a></nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode"><span class="theme-symbol" aria-hidden="true"></span><span data-theme-label>Dark</span></button>
  </header>
  <main class="cv-preview page-width" id="content">
    <div class="cv-preview-copy">
      <p class="section-label">CV preview</p>
      <h1>In progress.</h1>
      <p>My CV is not finished yet, but it will be available here soon.</p>
    </div>
    <figure class="cv-placeholder" aria-label="CV preview coming soon">
      <span aria-hidden="true">CV</span>
      <figcaption>Document preview will appear here</figcaption>
    </figure>
    <div class="cv-download-row">
      <button class="button cv-download-disabled" type="button" disabled aria-disabled="true">Download CV · Coming soon</button>
      <small>The PDF download will be enabled when the CV is ready.</small>
    </div>
    <a class="button secondary-button" href="/#cv">← Back to portfolio</a>
  </main>
  <script src="/script.js" defer></script>
</body>
</html>
